<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranking – Old MU</title>
  <meta name="description" content="Old MU rankings: the best characters by resets and level, PvP prestige, Devil Square and Blood Castle.">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/site.js" defer></script>
  <script src="/js/classes.js" defer></script>
  <script src="/js/ranking.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Old MU home"><img src="/img/logo-small.webp" alt="Old MU" width="74" height="50"></a>
      <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">☰</button>
      <nav class="nav">
        <a href="/#info">Server</a>
        <a href="/guide.html">Guide</a>
        <a href="/#events">Events</a>
        <a href="/ranking.html" aria-current="page">Ranking</a>
        <a href="/#start">Download</a>
        <span class="status-pill" data-status><span class="dot"></span><span data-status-text>Checking…</span></span>
        <a class="btn btn-red btn-small" href="/register.html">Register</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <h1>Ranking</h1>
        <span class="ornament"></span>
        <div class="online-now" data-online-now>
          <div class="online-number"><span class="dot"></span><b data-online-count>–</b></div>
          <div class="online-text" data-online-label>players online</div>
        </div>
      </div>
    </section>

    <section class="ranking-section">
      <div class="wrap">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-board="characters" aria-selected="true">Characters</button>
          <button type="button" role="tab" data-board="pvp-week">PvP – this week</button>
          <button type="button" role="tab" data-board="pvp-all">PvP – all time</button>
          <button type="button" role="tab" data-board="devil-square">Devil Square</button>
          <button type="button" role="tab" data-board="blood-castle">Blood Castle</button>
        </div>
        <div class="class-tabs" data-class-tabs></div>

        <div class="ranking-card">
          <div class="ranking-tools">
            <p class="ranking-note" data-note></p>
            <input type="search" class="ranking-search" placeholder="Find a character…" aria-label="Find a character" data-search>
          </div>
          <div class="table-scroll">
            <table class="ranking-table">
              <thead data-head></thead>
              <tbody data-body><tr><td class="empty">Loading…</td></tr></tbody>
            </table>
          </div>
          <p class="ranking-foot"><span class="dot online"></span> online now · updated every few minutes</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© Old MU. MU Online is a trademark of Webzen. This is a private, non-commercial server.</span>
      <span><a href="/register.html">Register</a> · <a href="/">Home</a></span>
    </div>
  </footer>
</body>
</html>
